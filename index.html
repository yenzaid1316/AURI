<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Auri">
<title>Auri ✨</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#0f0f1a;--surface:#1a1a2e;--surface2:#22223b;--border:#2d2d4a;
  --gold:#c9a96e;--gold-soft:#e8c98a;--gold-dim:rgba(201,169,110,0.15);
  --text:#f0ece4;--text-muted:#b0aac0;
  --red:#e05c6a;--orange:#e8834a;--yellow:#f0c040;--green:#5cc882;--blue:#5b9cf6;
  --radius:16px;--radius-sm:10px;--nav-h:72px;--top-h:60px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;overflow:hidden;font-size:12px;}
#app{display:flex;flex-direction:column;height:100vh;max-width:480px;margin:0 auto;position:relative;}
#topbar{height:var(--top-h);background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 20px;gap:12px;flex-shrink:0;position:relative;z-index:10;}
#topbar-title{font-family:'DM Serif Display',serif;font-size:22px;color:var(--gold);flex:1;}
#pages{flex:1;overflow:hidden;position:relative;}
.page{position:absolute;inset:0;overflow-y:auto;padding:16px 16px calc(var(--nav-h) + 16px);display:none;-webkit-overflow-scrolling:touch;}
.page.active{display:block;}
#navbar{height:var(--nav-h);background:var(--surface);border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-around;flex-shrink:0;padding-bottom:env(safe-area-inset-bottom);}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 12px;cursor:pointer;border-radius:12px;transition:background 0.15s,transform 0.1s;flex:1;}
.nav-item:active{background:var(--gold-dim);transform:scale(0.94);}
.nav-item.active .nav-icon{color:var(--gold);}
.nav-item.active .nav-label{color:var(--gold);font-weight:600;}
.nav-icon{font-size:22px;color:var(--text-muted);transition:color 0.2s;}
.nav-label{font-size:10px;color:var(--text-muted);font-weight:500;transition:color 0.2s;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:12px;}
.card-gold{border-color:var(--gold);background:linear-gradient(135deg,var(--surface) 0%,rgba(201,169,110,0.08) 100%);}
.section-title{font-size:13px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:1px;margin:20px 0 10px;}
.section-title:first-child{margin-top:0;}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 20px;border-radius:var(--radius-sm);border:none;font-family:'DM Sans',sans-serif;font-weight:600;font-size:14px;cursor:pointer;transition:transform 0.1s,background 0.15s;width:100%;}
.btn:active{transform:scale(0.97);}
.btn-gold{background:var(--gold);color:#0f0f1a;}
.btn-gold:active{background:var(--gold-soft);}
.btn-outline{background:transparent;color:var(--gold);border:1.5px solid var(--gold);}
.btn-danger{background:rgba(224,92,106,0.15);color:var(--red);border:1px solid var(--red);}
.btn-sm{padding:7px 14px;font-size:13px;width:auto;}
.form-group{margin-bottom:14px;}
.form-label{font-size:13px;font-weight:600;color:var(--text-muted);margin-bottom:6px;display:block;}
.form-input{width:100%;background:var(--surface2);border:1.5px solid var(--border);border-radius:var(--radius-sm);padding:12px 14px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:15px;outline:none;transition:border-color 0.2s;}
.form-input:focus{border-color:var(--gold);}
.form-input::placeholder{color:var(--text-muted);}
select.form-input option{background:var(--surface2);}
.row{display:flex;gap:10px;}
.row .form-group{flex:1;}
.item{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px;margin-bottom:8px;display:flex;align-items:flex-start;gap:12px;transition:transform 0.1s;}
.item-icon{font-size:20px;flex-shrink:0;margin-top:2px;}
.item-body{flex:1;min-width:0;}
.item-title{font-weight:600;font-size:16px;margin-bottom:4px;color:#f0ece4;}
.item-sub{font-size:14px;color:#bbb5c8;}
.item-actions{display:flex;gap:6px;flex-shrink:0;align-items:center;}
.icon-btn{background:var(--surface2);border:1px solid var(--border);border-radius:8px;width:34px;height:34px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:15px;transition:background 0.15s,transform 0.1s;}
.icon-btn:active{background:var(--gold-dim);transform:scale(0.92);}
/* Menú de acciones tipo "..." */
.actions-menu-wrap{position:relative;}
.actions-menu{position:absolute;top:38px;right:0;background:var(--surface2);border:1px solid var(--border);border-radius:12px;overflow:hidden;z-index:50;min-width:160px;box-shadow:0 8px 24px rgba(0,0,0,0.4);display:none;}
.actions-menu.open{display:block;}
.actions-menu-item{display:flex;align-items:center;gap:10px;padding:12px 14px;font-size:14px;cursor:pointer;transition:background 0.15s;color:var(--text);}
.actions-menu-item:active{background:var(--gold-dim);}
.actions-menu-item.danger{color:var(--red);}
.actions-menu-divider{height:1px;background:var(--border);}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:100;display:none;align-items:flex-end;justify-content:center;}
.modal-overlay.open{display:flex;}
.modal{background:var(--surface);border-radius:24px 24px 0 0;padding:24px 20px;width:100%;max-width:480px;max-height:90vh;overflow-y:auto;animation:slideUp 0.3s ease;}
@keyframes slideUp{from{transform:translateY(100%);}to{transform:translateY(0);}}
.modal-handle{width:40px;height:4px;background:var(--border);border-radius:2px;margin:0 auto 20px;}
.modal-title{font-family:'DM Serif Display',serif;font-size:20px;color:var(--gold);margin-bottom:20px;}
#toast{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-80px);background:var(--surface2);border:1px solid var(--gold);color:var(--text);padding:12px 20px;border-radius:12px;font-size:14px;font-weight:500;z-index:999;transition:transform 0.3s ease;white-space:nowrap;max-width:90vw;}
#toast.show{transform:translateX(-50%) translateY(0);}
#saving-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:998;display:none;align-items:center;justify-content:center;flex-direction:column;gap:16px;}
#saving-overlay.show{display:flex;}
.saving-box{background:var(--surface);border:1px solid var(--gold);border-radius:16px;padding:24px 32px;display:flex;flex-direction:column;align-items:center;gap:12px;}
.saving-text{font-size:15px;font-weight:600;color:var(--gold);}
#modal-confirm .modal{text-align:center;}
.confirm-icon{font-size:48px;margin-bottom:8px;}
.confirm-msg{font-size:16px;color:var(--text);margin-bottom:6px;font-weight:600;}
.confirm-sub{font-size:14px;color:var(--text-muted);margin-bottom:20px;}
.loader{display:flex;align-items:center;justify-content:center;padding:40px;}
.spinner{width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--gold);border-radius:50%;animation:spin 0.8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.empty{text-align:center;padding:48px 20px;color:var(--text-muted);}
.empty-icon{font-size:48px;margin-bottom:12px;}
.empty-text{font-size:15px;}
.error-box{text-align:center;padding:40px 20px;}
.error-box .empty-icon{margin-bottom:10px;}
.error-box .empty-text{margin-bottom:16px;color:var(--text-muted);}
.alerta-item{display:flex;align-items:center;gap:12px;padding:12px;background:var(--surface2);border-radius:var(--radius-sm);margin-bottom:8px;border-left:4px solid;}
.alerta-vencido{border-left-color:var(--red);background:rgba(224,92,106,0.08);}
.alerta-hoy{border-left-color:var(--orange);background:rgba(232,131,74,0.08);}
.alerta-semana{border-left-color:var(--yellow);}
.alerta-ok{border-left-color:var(--green);}
.modulo-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px;}
.modulo-card{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px;cursor:pointer;transition:border-color 0.15s,background 0.15s,transform 0.1s;}
.modulo-card:active{border-color:var(--gold);background:var(--gold-dim);transform:scale(0.97);}
.modulo-emoji{font-size:26px;margin-bottom:6px;}
.modulo-name{font-size:12px;font-weight:600;color:var(--text-muted);margin-bottom:4px;}
.modulo-count{font-size:22px;font-weight:700;color:var(--text);}
.modulo-sub{font-size:12px;color:var(--text-muted);}
.progress-bar{background:var(--surface2);border-radius:8px;height:8px;overflow:hidden;margin:8px 0;}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--gold),var(--gold-soft));border-radius:8px;transition:width 0.5s ease;}
.check-item{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);margin-bottom:8px;cursor:pointer;transition:transform 0.1s;}
.check-item:active{transform:scale(0.98);}
.check-item.done{opacity:0.55;}
.check-circle{width:24px;height:24px;border-radius:50%;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all 0.2s;}
.check-item.done .check-circle{background:var(--green);border-color:var(--green);}
.check-text{flex:1;font-size:15px;}
.check-item.done .check-text{text-decoration:line-through;color:var(--text-muted);}
.check-place{font-size:11px;color:var(--text-muted);background:var(--surface2);padding:2px 8px;border-radius:6px;}
.comprados-separador{font-size:12px;font-weight:700;color:var(--green);text-transform:uppercase;letter-spacing:1px;margin:16px 0 8px;padding-top:10px;border-top:1px solid var(--border);}
.dia-grupo{margin-bottom:16px;}
.dia-label{font-size:12px;font-weight:700;color:var(--gold);text-transform:uppercase;letter-spacing:1px;padding:6px 10px;background:var(--gold-dim);border-radius:6px;margin-bottom:8px;display:inline-block;}
.filtros{display:flex;gap:8px;margin-bottom:16px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;}
.filtros::-webkit-scrollbar{display:none;}
.filtro-btn{flex-shrink:0;padding:7px 16px;border-radius:20px;border:1.5px solid var(--border);background:transparent;color:var(--text-muted);font-family:'DM Sans',sans-serif;font-size:13px;font-weight:600;cursor:pointer;transition:all 0.15s;}
.filtro-btn.active{border-color:var(--gold);color:var(--gold);background:var(--gold-dim);}
.header-gold{background:linear-gradient(135deg,var(--surface) 0%,rgba(201,169,110,0.1) 100%);border:1px solid var(--gold);border-radius:var(--radius);padding:16px;margin-bottom:16px;}
.header-gold-label{font-size:12px;color:var(--text-muted);font-weight:600;margin-bottom:4px;}
.header-gold-value{font-family:'DM Serif Display',serif;font-size:28px;color:var(--gold);}
.header-gold-sub{font-size:13px;color:var(--text-muted);margin-top:4px;}
.vencido-badge{background:rgba(224,92,106,0.18);color:var(--red);font-size:12px;font-weight:700;padding:3px 8px;border-radius:6px;}
.pendiente-badge{background:rgba(240,192,64,0.15);color:var(--yellow);font-size:12px;font-weight:600;padding:3px 8px;border-radius:6px;}
.entregado-badge{background:rgba(92,200,130,0.15);color:var(--green);font-size:12px;font-weight:600;padding:3px 8px;border-radius:6px;}
.pagado-badge{background:rgba(92,200,130,0.15);color:var(--green);font-size:12px;font-weight:600;padding:3px 8px;border-radius:6px;}
.hecha-badge{background:rgba(92,200,130,0.15);color:var(--green);font-size:12px;font-weight:600;padding:3px 8px;border-radius:6px;}
.proxima-badge{background:rgba(91,156,246,0.15);color:var(--blue);font-size:12px;font-weight:600;padding:3px 8px;border-radius:6px;}
.urgente-card{background:linear-gradient(135deg,rgba(201,169,110,0.14),rgba(201,169,110,0.04));border:1.5px solid var(--gold);border-radius:var(--radius);padding:16px;margin-bottom:16px;cursor:pointer;transition:transform 0.1s;}
.urgente-card:active{background:var(--gold-dim);transform:scale(0.98);}
.ver-todos-btn{text-align:center;font-size:13px;color:var(--gold);font-weight:600;padding:10px;cursor:pointer;}
</style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <div id="topbar-title">✨ Auri</div>
    <button class="btn-sm btn btn-outline" id="btn-topbar-add" onclick="handleTopbarAdd()" style="width:auto">+ Agregar</button>
  </div>
  <div id="pages">
    <div class="page active" id="page-inicio"><div id="dashboard-content"><div class="loader"><div class="spinner"></div></div></div></div>
    <div class="page" id="page-prestamos">
      <div class="header-gold">
        <div class="header-gold-label">💸 Cola de solicitudes</div>
        <div class="header-gold-value" id="prestamos-total">$0</div>
        <div class="header-gold-sub" id="prestamos-count">0 solicitudes pendientes</div>
      </div>
      <div class="filtros">
        <button class="filtro-btn active" onclick="filtrarPrestamos('Pendiente',this)">⏳ Pendientes</button>
        <button class="filtro-btn" onclick="filtrarPrestamos('Entregado',this)">✅ Entregados</button>
        <button class="filtro-btn" onclick="filtrarPrestamos('todos',this)">📋 Todos</button>
      </div>
      <div id="prestamos-list"><div class="loader"><div class="spinner"></div></div></div>
    </div>
    <div class="page" id="page-pagos">
      <div id="pagos-header-total" class="header-gold" style="display:none">
        <div class="header-gold-label">🔔 Total pendiente del mes</div>
        <div class="header-gold-value" id="pagos-total-mes">$0</div>
        <div class="header-gold-sub" id="pagos-count-mes">0 pagos pendientes</div>
      </div>
      <div class="filtros">
        <button class="filtro-btn active" onclick="filtrarPagos('todos',this)">📋 Todos</button>
        <button class="filtro-btn" onclick="filtrarPagos('Pendiente',this)">⏳ Pendientes</button>
        <button class="filtro-btn" onclick="filtrarPagos('proximo',this)">🔵 Próximos</button>
        <button class="filtro-btn" onclick="filtrarPagos('vencido',this)">🔴 Vencidos</button>
        <button class="filtro-btn" onclick="filtrarPagos('Pagado',this)">✅ Pagados</button>
      </div>
      <div id="pagos-list"><div class="loader"><div class="spinner"></div></div></div>
    </div>
    <div class="page" id="page-listas"><div id="listas-content"><div class="loader"><div class="spinner"></div></div></div></div>
    <div class="page" id="page-mas">
      <div class="filtros">
        <button class="filtro-btn active" onclick="cambiarSeccionMas('gestiones',this)">📅 Gestiones</button>
        <button class="filtro-btn" onclick="cambiarSeccionMas('prestados',this)">📦 Prestados</button>
        <button class="filtro-btn" onclick="cambiarSeccionMas('semana',this)">🗓️ Semana</button>
      </div>
      <div id="mas-content"><div class="loader"><div class="spinner"></div></div></div>
    </div>
  </div>
  <nav id="navbar">
    <div class="nav-item active" onclick="navigate('inicio',this)"><span class="nav-icon">🏠</span><span class="nav-label">Inicio</span></div>
    <div class="nav-item" onclick="navigate('prestamos',this)"><span class="nav-icon">💸</span><span class="nav-label">Préstamos</span></div>
    <div class="nav-item" onclick="navigate('pagos',this)"><span class="nav-icon">🔔</span><span class="nav-label">Pagos</span></div>
    <div class="nav-item" onclick="navigate('listas',this)"><span class="nav-icon">🛒</span><span class="nav-label">Listas</span></div>
    <div class="nav-item" onclick="navigate('mas',this)"><span class="nav-icon">📅</span><span class="nav-label">Más</span></div>
  </nav>
</div>

<div id="saving-overlay">
  <div class="saving-box">
    <div class="spinner"></div>
    <div class="saving-text" id="saving-text">💾 Guardando...</div>
  </div>
</div>

<div class="modal-overlay" id="modal-confirm">
  <div class="modal">
    <div class="modal-handle"></div>
    <div style="text-align:center">
      <div class="confirm-icon" id="confirm-icon">⚠️</div>
      <div class="confirm-msg" id="confirm-msg">¿Estás segura?</div>
      <div class="confirm-sub" id="confirm-sub"></div>
      <div style="display:flex;gap:10px;margin-top:8px">
        <button class="btn btn-outline btn-sm" style="flex:1" onclick="closeModal('modal-confirm')">Cancelar</button>
        <button class="btn btn-gold" style="flex:2" id="confirm-ok-btn">Confirmar</button>
      </div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modal-prestamo">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title" id="prestamo-modal-title">💸 Nueva Solicitud</div>
    <input type="hidden" id="prestamo-id">
    <div class="form-group"><label class="form-label">Nombre de la persona</label><input class="form-input" id="prestamo-nombre" placeholder="¿Quién solicitó?" type="text"></div>
    <div class="row">
      <div class="form-group"><label class="form-label">Monto solicitado</label><input class="form-input" id="prestamo-monto" placeholder="$0" type="number"></div>
      <div class="form-group"><label class="form-label">Fecha solicitud</label><input class="form-input" id="prestamo-fecha" type="date"></div>
    </div>
    <div class="form-group"><label class="form-label">Notas (opcional)</label><input class="form-input" id="prestamo-notas" placeholder="Observaciones..." type="text"></div>
    <div style="display:flex;gap:10px;margin-top:8px">
      <button class="btn btn-outline btn-sm" style="flex:1" onclick="closeModal('modal-prestamo')">Cancelar</button>
      <button class="btn btn-gold" style="flex:2" id="btn-save-prestamo" onclick="savePrestamo()">💾 Guardar</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modal-pago">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title" id="pago-modal-title">🔔 Nuevo Pago</div>
    <input type="hidden" id="pago-id">
    <div class="form-group"><label class="form-label">Nombre del pago</label><input class="form-input" id="pago-nombre" placeholder="Ej: Banco, Luz, Netflix..." type="text"></div>
    <div class="row">
      <div class="form-group"><label class="form-label">Monto</label><input class="form-input" id="pago-monto" placeholder="$0" type="number"></div>
      <div class="form-group"><label class="form-label">Categoría</label>
        <select class="form-input" id="pago-categoria">
          <option value="Banco">🏦 Banco</option><option value="Servicio">💡 Servicio</option>
          <option value="Streaming">📱 Streaming</option><option value="Arriendo">🏠 Arriendo</option>
          <option value="Salud">🏥 Salud</option><option value="Otro">📌 Otro</option>
        </select>
      </div>
    </div>
    <div class="row">
      <div class="form-group"><label class="form-label">Fecha vencimiento</label><input class="form-input" id="pago-fecha" type="date"></div>
      <div class="form-group"><label class="form-label">Alertar con</label>
        <select class="form-input" id="pago-alerta">
          <option value="0">Sin alerta</option><option value="1">1 día antes</option>
          <option value="2">2 días antes</option><option value="3" selected>3 días antes</option>
          <option value="5">5 días antes</option><option value="7">1 semana antes</option>
        </select>
      </div>
    </div>
    <div class="row">
      <div class="form-group"><label class="form-label">¿Es recurrente?</label>
        <select class="form-input" id="pago-recurrente"><option value="No">No</option><option value="Mensual">Mensual</option></select>
      </div>
      <div class="form-group"><label class="form-label">Día del mes</label><input class="form-input" id="pago-diames" placeholder="Ej: 15" type="number" min="1" max="31"></div>
    </div>
    <div style="display:flex;gap:10px;margin-top:8px">
      <button class="btn btn-outline btn-sm" style="flex:1" onclick="closeModal('modal-pago')">Cancelar</button>
      <button class="btn btn-gold" style="flex:2" id="btn-save-pago" onclick="savePago()">💾 Guardar</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modal-lista">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title" id="lista-modal-title">🛒 Nueva Lista</div>
    <input type="hidden" id="lista-id">
    <div class="form-group"><label class="form-label">Nombre de la lista</label><input class="form-input" id="lista-nombre" placeholder="Ej: Mercado, Farmacia, Ropa..." type="text"></div>
    <div style="display:flex;gap:10px;margin-top:8px">
      <button class="btn btn-outline btn-sm" style="flex:1" onclick="closeModal('modal-lista')">Cancelar</button>
      <button class="btn btn-gold" style="flex:2" id="btn-save-lista" onclick="saveLista()">💾 Guardar</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modal-item">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title" id="item-modal-title">➕ Agregar ítem</div>
    <input type="hidden" id="item-lista-id">
    <input type="hidden" id="item-lista-nombre">

<script>
const API='https://script.google.com/macros/s/AKfycby5_C5A6GaxMKlVLrxdrUbeXUeiUfDYwndLRWsEGKkezyUcgbSvSA6ir0GFx3m5Onb-ew/exec';

const state={
  currentPage:'inicio',currentSeccionMas:'gestiones',
  filtroListaActiva:null,filtroListaFiltro:'todos',filtroListaLugar:'todos',
  filtroGestiones:'pendientes',filtroPrestados:'pendientes',
  verTodosSemana:false,
  data:{prestamos:[],pagos:[],listas:[],items:[],gestiones:[],prestados:[]}
};

// ── SAVING OVERLAY ───────────────────────────────
function showSaving(msg='💾 Guardando...'){
  document.getElementById('saving-text').textContent=msg;
  document.getElementById('saving-overlay').classList.add('show');
}
function hideSaving(){
  document.getElementById('saving-overlay').classList.remove('show');
}

// ── CONFIRM MODAL ────────────────────────────────
function showConfirm({icon='⚠️',msg,sub='',okLabel='Confirmar',okClass='btn-gold',onOk}){
  document.getElementById('confirm-icon').textContent=icon;
  document.getElementById('confirm-msg').textContent=msg;
  document.getElementById('confirm-sub').textContent=sub;
  const okBtn=document.getElementById('confirm-ok-btn');
  okBtn.textContent=okLabel;
  okBtn.className=`btn ${okClass}`;
  okBtn.style.flex='2';
  okBtn.onclick=()=>{closeModal('modal-confirm');onOk();};
  openModal('modal-confirm');
}

// ── API ──────────────────────────────────────────
async function api(params){
  try{const r=await fetch(`${API}?${new URLSearchParams(params)}`);return await r.json();}
  catch(e){return{error:e.toString()};}
}
async function apiPost(body){
  try{const r=await fetch(API,{method:'POST',body:JSON.stringify(body)});return await r.json();}
  catch(e){return{error:e.toString()};}
}

// ── UTILS ────────────────────────────────────────
function fmt(n){if(!n)return'$0';return'$'+Number(n).toLocaleString('es-CO');}
function fmtDate(d){
  if(!d)return'';
  const solo=String(d).split('T')[0].split(' ')[0];
  const partes=solo.split('-');
  if(partes.length<3)return String(d);
  const[y,m,dia]=partes;
  return`${dia} ${'ene,feb,mar,abr,may,jun,jul,ago,sep,oct,nov,dic'.split(',')[parseInt(m)-1]} ${y}`;
}
function today(){return new Date().toISOString().split('T')[0];}
function diasVencido(f){if(!f)return 0;return Math.floor((new Date(today())-new Date(f))/86400000);}
function showToast(msg){
  const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2800);
}
function openModal(id){document.getElementById(id).classList.add('open');}
function closeModal(id){document.getElementById(id).classList.remove('open');}
document.querySelectorAll('.modal-overlay').forEach(o=>{
  o.addEventListener('click',e=>{if(e.target===o)o.classList.remove('open');});
});
// Cierra cualquier menú de acciones "..." abierto al tocar fuera
document.addEventListener('click',e=>{
  if(!e.target.closest('.actions-menu-wrap')){
    document.querySelectorAll('.actions-menu.open').forEach(m=>m.classList.remove('open'));
  }
});
function toggleActionsMenu(id,ev){
  ev.stopPropagation();
  const menu=document.getElementById(id);
  const estabaAbierto=menu.classList.contains('open');
  document.querySelectorAll('.actions-menu.open').forEach(m=>m.classList.remove('open'));
  if(!estabaAbierto)menu.classList.add('open');
}

// ── NAVEGACIÓN ───────────────────────────────────
function navigate(page,el){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  document.getElementById('page-'+page).classList.add('active');
  if(el)el.classList.add('active');
  state.currentPage=page;
  updateTopbarAddLabel();
  if(page==='inicio')loadDashboard();
  else if(page==='prestamos')loadPrestamos();
  else if(page==='pagos')loadPagos();
  else if(page==='listas')loadListas();
  else if(page==='mas')loadMas(state.currentSeccionMas);
}
// Navega a "Más" mostrando directamente una sección específica, sin doble carga
function navigateAMas(seccion){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  document.getElementById('page-mas').classList.add('active');
  document.querySelectorAll('.nav-item')[4].classList.add('active');
  state.currentPage='mas';
  state.currentSeccionMas=seccion;
  document.querySelectorAll('#page-mas .filtro-btn').forEach(b=>b.classList.remove('active'));
  const idx=seccion==='gestiones'?0:seccion==='prestados'?1:2;
  document.querySelectorAll('#page-mas .filtro-btn')[idx].classList.add('active');
  updateTopbarAddLabel();
  loadMas(seccion);
}

// ── BOTÓN "+ AGREGAR" CONTEXTUAL ──────────────────
function updateTopbarAddLabel(){
  const btn=document.getElementById('btn-topbar-add');
  if(state.currentPage==='listas'&&state.filtroListaActiva){
    btn.textContent='+ Ítem';
  }else{
    btn.textContent='+ Agregar';
  }
}
function handleTopbarAdd(){
  if(state.currentPage==='listas'&&state.filtroListaActiva){
    const lista=state.data.listas.find(l=>l.ID===state.filtroListaActiva);
    if(lista){openAddItemModal(lista.ID,lista.Nombre_Lista);return;}
  }
  openAddModal();
}

function openAddModal(){openModal('modal-add');}
function openSpecificModal(tipo){
  closeModal('modal-add');clearForm(tipo);openModal('modal-'+tipo);
}
function clearForm(tipo){
  const tv=today();
  if(tipo==='prestamo'){
    document.getElementById('prestamo-id').value='';
    document.getElementById('prestamo-nombre').value='';
    document.getElementById('prestamo-monto').value='';
    document.getElementById('prestamo-fecha').value=tv;
    document.getElementById('prestamo-notas').value='';
    document.getElementById('prestamo-modal-title').textContent='💸 Nueva Solicitud';
  }else if(tipo==='pago'){
    document.getElementById('pago-id').value='';
    document.getElementById('pago-nombre').value='';
    document.getElementById('pago-monto').value='';
    document.getElementById('pago-fecha').value=tv;
    document.getElementById('pago-alerta').value='3';
    document.getElementById('pago-recurrente').value='No';
    document.getElementById('pago-diames').value='';
    document.getElementById('pago-modal-title').textContent='🔔 Nuevo Pago';
  }else if(tipo==='lista'){
    document.getElementById('lista-id').value='';
    document.getElementById('lista-nombre').value='';
    document.getElementById('lista-modal-title').textContent='🛒 Nueva Lista';
  }else if(tipo==='gestion'){
    document.getElementById('gestion-id').value='';
    document.getElementById('gestion-desc').value='';
    document.getElementById('gestion-fecha').value=tv;
    document.getElementById('gestion-hora').value='';
    document.getElementById('gestion-notas').value='';
    document.getElementById('gestion-modal-title').textContent='📅 Nueva Gestión';
  }else if(tipo==='prestado'){
    document.getElementById('prestado-id').value='';
    document.getElementById('prestado-desc').value='';
    document.getElementById('prestado-persona').value='';
    document.getElementById('prestado-fecha').value=tv;
    document.getElementById('prestado-devolucion').value='';
    document.getElementById('prestado-notas').value='';
    document.getElementById('prestado-modal-title').textContent='📦 Nuevo Prestado';
  }
}

// ── DETECCIÓN DE DUPLICADOS ──────────────────────
function checkDuplicate(lista,campo,valor,idActual=''){
  return lista.find(i=>
    i[campo]&&i[campo].toLowerCase().trim()===valor.toLowerCase().trim()&&
    String(i.ID)!==String(idActual)
  );
}
function confirmDuplicate(msg,onProceed){
  showConfirm({icon:'🔁',msg:'Posible duplicado',sub:msg,okLabel:'Sí, guardar igual',okClass:'btn-outline',onOk:onProceed});
}

// ── DASHBOARD ────────────────────────────────────
async function loadDashboard(){
  const el=document.getElementById('dashboard-content');
  el.innerHTML='<div class="loader"><div class="spinner"></div></div>';
  const[resDash,resConf]=await Promise.all([api({action:'getDashboard'}),api({action:'getConfig'})]);
  if(resDash.error){
    el.innerHTML=`<div class="error-box"><div class="empty-icon">⚠️</div><div class="empty-text">No se pudo cargar tu información.<br>Revisa tu conexión.</div><button class="btn btn-outline btn-sm" style="width:auto;margin:0 auto" onclick="loadDashboard()">🔄 Reintentar</button></div>`;
    return;
  }
  const d=resDash.data;
  const nombre=(resConf.data||{}).nombre_usuario||'Mi Amor';
  const hora=new Date().getHours();
  const saludo=hora<12?'🌅 Buenos días':hora<18?'☀️ Buenas tardes':'🌙 Buenas noches';
  const{alertas,resumen,proximos_7_dias}=d;
  const totalVencidos=alertas.vencidos,totalHoy=alertas.hoy;
  const hechas=resumen.gestiones.hechas_semana||0;
  const totalSemana=resumen.gestiones.total_semana||0;
  const pct=totalSemana>0?Math.round((hechas/totalSemana)*100):0;

  let masUrgente=null;
  if(proximos_7_dias.length>0)masUrgente=proximos_7_dias[0];

  let html=`
    <div class="card card-gold" style="margin-bottom:16px">
      <div style="font-size:13px;color:var(--text-muted);margin-bottom:4px">${saludo},</div>
      <div style="font-family:'DM Serif Display',serif;font-size:24px;color:var(--gold);margin-bottom:8px">${nombre} 👑</div>
      <div style="font-size:14px;color:var(--text);font-style:italic">${d.frase}</div>
    </div>`;

  if(masUrgente){
    html+=`<div class="urgente-card" onclick="navigateAMas('semana')">
      <div style="font-size:11px;font-weight:700;color:var(--gold);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px">⚡ Lo más urgente ahora</div>
      <div style="font-size:15px;font-weight:600">${masUrgente.emoji} ${masUrgente.texto}</div>
      <div style="font-size:12px;color:var(--text-muted);margin-top:3px">${fmtDate(masUrgente.fecha)}${masUrgente.monto?' · '+fmt(masUrgente.monto):''}${masUrgente.hora?' · '+masUrgente.hora:''}</div>
    </div>`;
  }

  if(totalVencidos>0||totalHoy>0){
    html+=`<div class="section-title">⚠️ Requiere atención</div>`;
    if(totalVencidos>0)html+=`<div class="alerta-item alerta-vencido"><span style="font-size:20px">🔴</span><div><div style="font-weight:600;font-size:14px">Vencidos</div><div style="font-size:13px;color:var(--text-muted)">${totalVencidos} ítem${totalVencidos!==1?'s':''} vencidos</div></div></div>`;
    if(totalHoy>0)html+=`<div class="alerta-item alerta-hoy"><span style="font-size:20px">🟠</span><div><div style="font-weight:600;font-size:14px">Vencen hoy</div><div style="font-size:13px;color:var(--text-muted)">${totalHoy} ítem${totalHoy!==1?'s':''} para hoy</div></div></div>`;
  }else{
    html+=`<div class="alerta-item alerta-ok"><span style="font-size:20px">✅</span><div><div style="font-weight:600;font-size:14px">¡Todo al día!</div><div style="font-size:13px;color:var(--text-muted)">No tienes nada vencido</div></div></div>`;
  }

  html+=`<div class="card" style="margin-top:16px">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
      <div style="font-size:13px;font-weight:700;color:var(--text-muted)">📊 Tu semana</div>
      <div style="font-size:13px;color:var(--gold);font-weight:700">${hechas}/${totalSemana} hechas</div>
    </div>
    <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
    <div style="font-size:12px;color:var(--text-muted);margin-top:4px">${totalSemana===0?'Aún no registras gestiones esta semana':pct+'% completado · ¡'+(pct>=80?'Excelente gestión 🏆':pct>=50?'Vas muy bien 💪':'Sigue adelante ⭐')+'!'}</div>
  </div>`;

  html+=`<div class="section-title">📋 Módulos</div>
  <div class="modulo-grid">
    <div class="modulo-card" onclick="navigate('prestamos',document.querySelectorAll('.nav-item')[1])">
      <div class="modulo-emoji">💸</div><div class="modulo-name">Préstamos</div>
      <div class="modulo-count">${resumen.prestamos.pendientes}</div><div class="modulo-sub">en cola</div>
    </div>
    <div class="modulo-card" onclick="navigate('pagos',document.querySelectorAll('.nav-item')[2])">
      <div class="modulo-emoji">🔔</div><div class="modulo-name">Pagos</div>
      <div class="modulo-count">${resumen.pagos.vencidos+resumen.pagos.hoy}</div><div class="modulo-sub">urgentes</div>
    </div>
    <div class="modulo-card" onclick="navigate('listas',document.querySelectorAll('.nav-item')[3])">
      <div class="modulo-emoji">🛒</div><div class="modulo-name">Listas</div>
      <div class="modulo-count">${resumen.listas.items_pendientes}</div><div class="modulo-sub">por comprar</div>
    </div>
    <div class="modulo-card" onclick="navigateAMas('gestiones')">
      <div class="modulo-emoji">📅</div><div class="modulo-name">Gestiones</div>
      <div class="modulo-count">${resumen.gestiones.vencidas+resumen.gestiones.hoy}</div><div class="modulo-sub">urgentes</div>
    </div>
  </div>
  <div class="modulo-card" style="margin-bottom:10px" onclick="navigateAMas('prestados')">
    <div style="display:flex;align-items:center;gap:12px">
      <span style="font-size:26px">📦</span>
      <div><div class="modulo-name">Cosas Prestadas</div><div class="modulo-count" style="font-size:18px">${resumen.prestados.pendientes} pendientes</div></div>
    </div>
  </div>`;

  if(proximos_7_dias.length>0){
    html+=`<div class="section-title">🗓️ Próximos días</div>`;
    proximos_7_dias.slice(0,3).forEach(item=>{
      html+=`<div class="alerta-item alerta-semana"><span style="font-size:18px">${item.emoji}</span>
        <div style="flex:1"><div style="font-weight:600;font-size:14px">${item.texto}</div>
        <div style="font-size:12px;color:var(--text-muted)">${fmtDate(item.fecha)}${item.monto?' · '+fmt(item.monto):''}${item.hora?' · '+item.hora:''}</div></div></div>`;
    });
    if(proximos_7_dias.length>3){
      html+=`<div class="ver-todos-btn" onclick="navigateAMas('semana')">Ver los ${proximos_7_dias.length} próximos →</div>`;
    }
  }
  el.innerHTML=html;
}

// ── PRÉSTAMOS ────────────────────────────────────
let filtroPrestamoActual='Pendiente';
async function loadPrestamos(){
  const res=await api({action:'getAll',sheet:'Prestamos'});
  const el=document.getElementById('prestamos-list');
  if(res.error){el.innerHTML=`<div class="error-box"><div class="empty-icon">⚠️</div><div class="empty-text">Error de conexión</div><button class="btn btn-outline btn-sm" style="width:auto;margin:0 auto" onclick="loadPrestamos()">🔄 Reintentar</button></div>`;return;}
  state.data.prestamos=res.data||[];
  renderPrestamos(filtroPrestamoActual);
}
function filtrarPrestamos(f,btn){
  filtroPrestamoActual=f;
  document.querySelectorAll('#page-prestamos .filtro-btn').forEach(b=>b.classList.remove('active'));
  if(btn)btn.classList.add('active');
  renderPrestamos(f);
}
function renderPrestamos(filtro){
  let items=state.data.prestamos;
  if(filtro!=='todos')items=items.filter(p=>p.Estado===filtro);
  items.sort((a,b)=>a.Fecha_Solicitud>b.Fecha_Solicitud?1:-1);
  const pend=state.data.prestamos.filter(p=>p.Estado==='Pendiente');
  const total=pend.reduce((s,p)=>s+(Number(p.Monto)||0),0);
  document.getElementById('prestamos-total').textContent=fmt(total);
  document.getElementById('prestamos-count').textContent=`${pend.length} solicitud${pend.length!==1?'es':''} pendiente${pend.length!==1?'s':''}`;
  const el=document.getElementById('prestamos-list');
  if(!items.length){el.innerHTML=`<div class="empty"><div class="empty-icon">💸</div><div class="empty-text">No hay solicitudes ${filtro==='todos'?'':filtro==='Pendiente'?'pendientes':'entregadas'}</div></div>`;return;}
  el.innerHTML=items.map((p,i)=>`
    <div class="item">
      <div class="item-icon" style="background:var(--gold-dim);border-radius:50%;width:36px;height:36px;display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--gold);font-size:14px">${i+1}</div>
      <div class="item-body">
        <div class="item-title">${p.Nombre}</div>
        <div class="item-sub">${fmt(p.Monto)} · ${fmtDate(p.Fecha_Solicitud)}</div>
        ${p.Notas?`<div style="font-size:12px;color:var(--text-muted);margin-top:3px">${p.Notas}</div>`:''}
        <div style="margin-top:6px">
          ${p.Estado==='Pendiente'?'<span class="pendiente-badge">⏳ Pendiente</span>':'<span class="entregado-badge">✅ Entregado</span>'}
        </div>
      </div>
      <div class="item-actions" style="flex-direction:column;gap:6px">

let filtroPagoActual='todos';
async function loadPagos(){
  const res=await api({action:'getAll',sheet:'Pagos'});
  const el=document.getElementById('pagos-list');
  if(res.error){el.innerHTML=`<div class="error-box"><div class="empty-icon">⚠️</div><div class="empty-text">Error de conexión</div><button class="btn btn-outline btn-sm" style="width:auto;margin:0 auto" onclick="loadPagos()">🔄 Reintentar</button></div>`;return;}
  state.data.pagos=res.data||[];
  const pend=state.data.pagos.filter(p=>p.Estado==='Pendiente');
  const totalMes=pend.reduce((s,p)=>s+(Number(p.Monto)||0),0);
  const hdr=document.getElementById('pagos-header-total');
  if(pend.length>0){
    hdr.style.display='block';
    document.getElementById('pagos-total-mes').textContent=fmt(totalMes);
    document.getElementById('pagos-count-mes').textContent=`${pend.length} pago${pend.length!==1?'s':''} pendiente${pend.length!==1?'s':''}`;
  }else{hdr.style.display='none';}
  renderPagos(filtroPagoActual);
}
function filtrarPagos(f,btn){
  filtroPagoActual=f;
  document.querySelectorAll('#page-pagos .filtro-btn').forEach(b=>b.classList.remove('active'));
  if(btn)btn.classList.add('active');
  renderPagos(f);
}
function renderPagos(filtro){
  const tod=today();
  let items=state.data.pagos;
  if(filtro==='Pendiente')items=items.filter(p=>p.Estado==='Pendiente'&&p.Fecha_Vencimiento>=tod);
  else if(filtro==='vencido')items=items.filter(p=>p.Estado==='Pendiente'&&p.Fecha_Vencimiento<tod);
  else if(filtro==='proximo')items=items.filter(p=>{
    if(p.Estado!=='Pendiente'||!p.Fecha_Vencimiento||p.Fecha_Vencimiento<=tod)return false;
    const dias=parseInt(p.Dias_Alerta,10)||0;
    if(dias<=0)return false;
    const diasFaltan=diasVencido(p.Fecha_Vencimiento)*-1;
    return diasFaltan<=dias;
  });
  else if(filtro==='Pagado')items=items.filter(p=>p.Estado==='Pagado');
  items.sort((a,b)=>a.Fecha_Vencimiento>b.Fecha_Vencimiento?1:-1);
  const el=document.getElementById('pagos-list');
  if(!items.length){el.innerHTML=`<div class="empty"><div class="empty-icon">🔔</div><div class="empty-text">No hay pagos aquí</div></div>`;return;}
  const catEmoji={Banco:'🏦',Servicio:'💡',Streaming:'📱',Arriendo:'🏠',Salud:'🏥',Otro:'📌'};
  el.innerHTML=items.map(p=>{
    const vencido=p.Estado==='Pendiente'&&p.Fecha_Vencimiento<tod;
    const diasV=vencido?diasVencido(p.Fecha_Vencimiento):0;
    const diasFaltan=!vencido&&p.Fecha_Vencimiento>tod?Math.round((new Date(p.Fecha_Vencimiento+'T12:00:00')-new Date(tod+'T12:00:00'))/86400000):null;
    const enAlerta=!vencido&&diasFaltan!==null&&(parseInt(p.Dias_Alerta,10)||0)>0&&diasFaltan<=(parseInt(p.Dias_Alerta,10)||0);
    return`<div class="item" style="${vencido?'border-color:var(--red);background:rgba(224,92,106,0.05)':''}">
      <div class="item-icon">${catEmoji[p.Categoria]||'📌'}</div>
      <div class="item-body">
        <div class="item-title">${p.Nombre}</div>
        <div class="item-sub">${fmt(p.Monto)} · Vence: ${fmtDate(p.Fecha_Vencimiento)}</div>
        ${p.Recurrente==='Mensual'?`<div style="font-size:11px;color:var(--text-muted)">🔄 Mensual · día ${p.Dia_Mes}</div>`:''}
        <div style="margin-top:6px;display:flex;gap:6px;flex-wrap:wrap">
          ${vencido?`<span class="vencido-badge">🔴 Vencido hace ${diasV} día${diasV!==1?'s':''}</span>`:p.Estado==='Pagado'?'<span class="pagado-badge">✅ Pagado</span>':enAlerta?`<span class="proxima-badge">🔵 Vence en ${diasFaltan} día${diasFaltan!==1?'s':''}</span>`:'<span class="pendiente-badge">⏳ Pendiente</span>'}
        </div>
      </div>
      <div class="item-actions" style="flex-direction:column;gap:6px">
        ${p.Estado==='Pendiente'?`<div class="icon-btn" onclick="marcarPagado('${p.ID}')">✅</div>`:''}
        ${p.Estado==='Pagado'&&p.Recurrente==='Mensual'?`<div class="icon-btn" onclick="renovarPago('${p.ID}')" title="Renovar para el próximo mes">🔄</div>`:''}
        <div class="icon-btn" onclick="editPago('${p.ID}')">✏️</div>
        <div class="icon-btn" onclick="deletePago('${p.ID}')">🗑️</div>
      </div>
    </div>`;
  }).join('');
}
async function savePago(forzar=false){
  const id=document.getElementById('pago-id').value;

async function loadListas(){
  const[resL,resI]=await Promise.all([api({action:'getAll',sheet:'Listas'}),api({action:'getAll',sheet:'Listas_Items'})]);
  if(resL.error||resI.error){
    document.getElementById('listas-content').innerHTML=`<div class="error-box"><div class="empty-icon">⚠️</div><div class="empty-text">Error de conexión</div><button class="btn btn-outline btn-sm" style="width:auto;margin:0 auto" onclick="loadListas()">🔄 Reintentar</button></div>`;
    return;
  }
  state.data.listas=resL.data||[];state.data.items=resI.data||[];
  if(state.filtroListaActiva)renderListaDetalle(state.filtroListaActiva);
  else renderListasIndex();
  updateTopbarAddLabel();
}
function renderListasIndex(){
  state.filtroListaActiva=null;
  updateTopbarAddLabel();
  const listas=state.data.listas.filter(l=>l.Estado==='Activa');
  const archivadas=state.data.listas.filter(l=>l.Estado==='Archivada');
  const el=document.getElementById('listas-content');
  let html='';
  if(!listas.length&&!archivadas.length){
    html=`
      <div class="empty"><div class="empty-icon">🛒</div><div class="empty-text">No tienes listas aún</div></div>
      <button class="btn btn-gold" onclick="openSpecificModal('lista')">+ Crear primera lista</button>`;
    el.innerHTML=html;return;
  }
  if(listas.length){
    html+=listas.map(l=>{
      const its=state.data.items.filter(i=>i.Lista_ID===l.ID);
      const pend=its.filter(i=>i.Estado==='Pendiente').length;
      const comp=its.filter(i=>i.Estado==='Comprado').length;
      const pct=its.length>0?Math.round((comp/its.length)*100):0;
      const menuId='menu-lista-'+l.ID;
      return`<div class="card" style="cursor:pointer;position:relative">
        <div style="display:flex;align-items:center;margin-bottom:8px">
          <div style="font-weight:700;font-size:16px;flex:1" onclick="abrirLista('${l.ID}')">🛒 ${l.Nombre_Lista}</div>
          <div class="actions-menu-wrap">
            <div class="icon-btn" onclick="toggleActionsMenu('${menuId}',event)">⋯</div>
            <div class="actions-menu" id="${menuId}">
              <div class="actions-menu-item" onclick="editLista('${l.ID}')">✏️ Renombrar</div>
              ${comp>0?`<div class="actions-menu-item" onclick="reiniciarLista('${l.ID}','${l.Nombre_Lista}',${comp})">🔄 Reiniciar lista</div>`:''}
              <div class="actions-menu-item" onclick="archivarLista('${l.ID}')">📦 Archivar</div>
              <div class="actions-menu-divider"></div>
              <div class="actions-menu-item danger" onclick="deleteLista('${l.ID}')">🗑️ Eliminar</div>
            </div>
          </div>
        </div>
        <div onclick="abrirLista('${l.ID}')">
          <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
          <div style="display:flex;justify-content:space-between;margin-top:6px">
            <div style="font-size:12px;color:var(--text-muted)">${pend} por comprar</div>
            <div style="font-size:12px;color:var(--green)">${comp} comprados</div>
          </div>
        </div>
      </div>`;
    }).join('');
  }
  html=`<button class="btn btn-outline" onclick="openSpecificModal('lista')" style="margin-bottom:16px">+ Nueva Lista</button>`+html;
  if(archivadas.length){
    html+=`<div class="section-title" style="margin-top:20px">📦 Archivadas (${archivadas.length})</div>`;
    html+=archivadas.map(l=>`
      <div class="item" style="opacity:0.6">
        <div class="item-icon">📦</div>
        <div class="item-body"><div class="item-title">${l.Nombre_Lista}</div></div>
        <div class="item-actions">
          <div class="icon-btn" onclick="desarchivarLista('${l.ID}')" title="Restaurar">♻️</div>
          <div class="icon-btn" onclick="deleteLista('${l.ID}')" title="Eliminar">🗑️</div>
        </div>
      </div>`).join('');
  }
  el.innerHTML=html;
}
function abrirLista(listaId){
  state.filtroListaActiva=listaId;state.filtroListaFiltro='todos';state.filtroListaLugar='todos';
  renderListaDetalle(listaId);
  updateTopbarAddLabel();
}
function renderListaDetalle(listaId){
  const lista=state.data.listas.find(l=>l.ID===listaId);if(!lista)return;
  let items=state.data.items.filter(i=>i.Lista_ID===listaId);
  if(state.filtroListaFiltro==='Pendiente')items=items.filter(i=>i.Estado==='Pendiente');
  else if(state.filtroListaFiltro==='Comprado')items=items.filter(i=>i.Estado==='Comprado');
  const lugares=[...new Set(state.data.items.filter(i=>i.Lista_ID===listaId&&i.Lugar_Compra).map(i=>i.Lugar_Compra))];
  if(state.filtroListaLugar!=='todos')items=items.filter(i=>i.Lugar_Compra===state.filtroListaLugar);
  const el=document.getElementById('listas-content');
  // Separar pendientes de comprados cuando el filtro es "todos"
  let bloqueHtml='';
  if(!items.length){
    bloqueHtml='<div class="empty"><div class="empty-icon">🛒</div><div class="empty-text">No hay ítems aquí</div></div>';
  }else if(state.filtroListaFiltro==='todos'){
    const pendientes=items.filter(i=>i.Estado==='Pendiente');
    const comprados=items.filter(i=>i.Estado==='Comprado');
    bloqueHtml=pendientes.map(i=>renderCheckItem(i)).join('');
    if(comprados.length){
      bloqueHtml+=`<div class="comprados-separador">✅ Ya compraste (${comprados.length})</div>`;
      bloqueHtml+=comprados.map(i=>renderCheckItem(i)).join('');
    }
  }else{
    bloqueHtml=items.map(i=>renderCheckItem(i)).join('');
  }
  const compradosCount=state.data.items.filter(i=>i.Lista_ID===listaId&&i.Estado==='Comprado').length;
  el.innerHTML=`
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:16px">
      <div class="icon-btn" onclick="renderListasIndex()">←</div>
      <div style="font-family:'DM Serif Display',serif;font-size:20px;color:var(--gold);flex:1">${lista.Nombre_Lista}</div>
      ${compradosCount>0?`<div class="actions-menu-wrap">
        <div class="icon-btn" onclick="toggleActionsMenu('menu-detalle-lista',event)">⋯</div>
        <div class="actions-menu" id="menu-detalle-lista">
          <div class="actions-menu-item" onclick="reiniciarLista('${lista.ID}','${lista.Nombre_Lista}',${compradosCount})">🔄 Reiniciar lista</div>
        </div>
      </div>`:''}
    </div>
    <div class="filtros">
      <button class="filtro-btn ${state.filtroListaFiltro==='todos'?'active':''}" onclick="filtroListaEstado('todos')">Todos</button>
      <button class="filtro-btn ${state.filtroListaFiltro==='Pendiente'?'active':''}" onclick="filtroListaEstado('Pendiente')">⏳ Pendiente</button>
      <button class="filtro-btn ${state.filtroListaFiltro==='Comprado'?'active':''}" onclick="filtroListaEstado('Comprado')">✅ Comprado</button>
      ${lugares.map(l=>`<button class="filtro-btn ${state.filtroListaLugar===l?'active':''}" onclick="filtroListaLugar2('${l}')">📍${l}</button>`).join('')}
    </div>
    ${bloqueHtml}`;
}
function renderCheckItem(i){
  return`<div class="check-item ${i.Estado==='Comprado'?'done':''}" onclick="toggleItem('${i.ID}')">
    <div class="check-circle">${i.Estado==='Comprado'?'✓':''}</div>
    <div class="check-text" style="flex:1">${i.Item}</div>
    ${i.Lugar_Compra?`<span class="check-place">📍${i.Lugar_Compra}</span>`:''}
    <div class="icon-btn" onclick="event.stopPropagation();deleteItem('${i.ID}')">🗑️</div>
  </div>`;
}
function filtroListaEstado(f){state.filtroListaFiltro=f;renderListaDetalle(state.filtroListaActiva);}
function filtroListaLugar2(l){state.filtroListaLugar=state.filtroListaLugar===l?'todos':l;renderListaDetalle(state.filtroListaActiva);}
function openAddItemModal(listaId,listaNombre){

async function archivarLista(id){
  const l=state.data.listas.find(x=>x.ID==id);
  showConfirm({icon:'📦',msg:`¿Archivar "${l?.Nombre_Lista}"?`,sub:'La lista quedará guardada pero no aparecerá activa ni en tus contadores.',okLabel:'Archivar',onOk:async()=>{
    showSaving('📦 Archivando...');
    await apiPost({action:'update',sheet:'Listas',id,data:{Estado:'Archivada'}});
    hideSaving();showToast('📦 Lista archivada');loadListas();
  }});
}
async function desarchivarLista(id){
  showSaving('♻️ Restaurando...');
  await apiPost({action:'update',sheet:'Listas',id,data:{Estado:'Activa'}});
  hideSaving();showToast('♻️ Lista restaurada');loadListas();
}
// Reactiva todos los ítems "Comprado" de una lista para reutilizarla
// (ej. mercado semanal repetitivo) sin tener que crear una lista nueva.
async function reiniciarLista(id,nombre,cantComprados){
  document.querySelectorAll('.actions-menu.open').forEach(m=>m.classList.remove('open'));
  showConfirm({icon:'🔄',msg:`¿Reiniciar "${nombre}"?`,
    sub:`Los ${cantComprados} ítem${cantComprados!==1?'s':''} marcado${cantComprados!==1?'s':''} como comprado${cantComprados!==1?'s':''} volverán a estar pendientes.`,
    okLabel:'Reiniciar',onOk:async()=>{
      showSaving('🔄 Reiniciando lista...');
      await apiPost({action:'reiniciarLista',id});
      hideSaving();showToast('🔄 Lista lista para tu próxima compra');
      await loadListas();
  }});
}
async function deleteLista(id){
  const l=state.data.listas.find(x=>x.ID==id);
  const itsCount=state.data.items.filter(i=>i.Lista_ID===id).length;
  showConfirm({icon:'🗑️',msg:`¿Eliminar "${l?.Nombre_Lista}"?`,
    sub:`Se eliminarán también los ${itsCount} ítem${itsCount!==1?'s':''} que contiene. Esta acción no se puede deshacer.`,
    okLabel:'Eliminar todo',okClass:'btn-danger',onOk:async()=>{
      showSaving('🗑️ Eliminando...');
      await apiPost({action:'deleteListaCascada',id});
      hideSaving();showToast('🗑️ Lista e ítems eliminados');loadListas();
  }});
}
async function toggleItem(id){
  const item=state.data.items.find(i=>i.ID==id);if(!item)return;
  const nuevoEstado=item.Estado==='Pendiente'?'Comprado':'Pendiente';
  item.Estado=nuevoEstado;
  if(state.filtroListaActiva)renderListaDetalle(state.filtroListaActiva);
  await apiPost({action:'update',sheet:'Listas_Items',id,data:{Estado:nuevoEstado}});
}
async function deleteItem(id){
  state.data.items=state.data.items.filter(i=>i.ID!=id);
  if(state.filtroListaActiva)renderListaDetalle(state.filtroListaActiva);
  showToast('🗑️ Ítem eliminado');
  await apiPost({action:'delete',sheet:'Listas_Items',id});
}

// ── MÁS ──────────────────────────────────────────
function cambiarSeccionMas(seccion,btn){
  state.currentSeccionMas=seccion;
  if(btn){document.querySelectorAll('#page-mas .filtro-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');}
  loadMas(seccion);
}
async function loadMas(seccion){
  const el=document.getElementById('mas-content');
  el.innerHTML='<div class="loader"><div class="spinner"></div></div>';
  if(seccion==='gestiones'){
    const res=await api({action:'getAll',sheet:'Gestiones'});
    if(res.error){el.innerHTML=`<div class="error-box"><div class="empty-icon">⚠️</div><div class="empty-text">Error de conexión</div><button class="btn btn-outline btn-sm" style="width:auto;margin:0 auto" onclick="loadMas('gestiones')">🔄 Reintentar</button></div>`;return;}
    state.data.gestiones=res.data||[];renderGestiones();
  }else if(seccion==='prestados'){
    const res=await api({action:'getAll',sheet:'Prestados'});
    if(res.error){el.innerHTML=`<div class="error-box"><div class="empty-icon">⚠️</div><div class="empty-text">Error de conexión</div><button class="btn btn-outline btn-sm" style="width:auto;margin:0 auto" onclick="loadMas('prestados')">🔄 Reintentar</button></div>`;return;}
    state.data.prestados=res.data||[];renderPrestados();
  }else if(seccion==='semana'){renderSemana();}
}

// ── GESTIONES ────────────────────────────────────
function renderGestiones(){
  const tod=today();
  const tipoEmoji={Diligencia:'🏃',Llamada:'📞',Cita:'🏥',Compra:'🛍️',Banco:'🏦',Otro:'📌'};
  const el=document.getElementById('mas-content');
  const pendientes=state.data.gestiones.filter(g=>g.Estado!=='Hecha');
  const historial=state.data.gestiones.filter(g=>g.Estado==='Hecha');
  pendientes.sort((a,b)=>a.Fecha>b.Fecha?1:-1);
  let html=`
    <div style="display:flex;gap:8px;margin-bottom:16px">
      <button class="btn btn-outline" style="flex:1" onclick="openSpecificModal('gestion')">+ Nueva Gestión</button>
    </div>
    <div class="filtros">
      <button class="filtro-btn ${state.filtroGestiones==='pendientes'?'active':''}" onclick="filtroGest('pendientes',this)">⏳ Pendientes (${pendientes.length})</button>
      <button class="filtro-btn ${state.filtroGestiones==='historial'?'active':''}" onclick="filtroGest('historial',this)">📋 Historial (${historial.length})</button>
    </div>`;
  const items=state.filtroGestiones==='historial'?historial:pendientes;
  if(!items.length){
    html+=`<div class="empty"><div class="empty-icon">📅</div><div class="empty-text">${state.filtroGestiones==='historial'?'Sin historial aún':'¡No hay gestiones pendientes! 🎉'}</div></div>`;
  }else{
    html+=items.map(g=>{
      const vencido=g.Estado!=='Hecha'&&g.Fecha&&g.Fecha<tod;
      const diasV=vencido?diasVencido(g.Fecha):0;
      return`<div class="item" style="${vencido?'border-color:var(--red);background:rgba(224,92,106,0.05)':''}">
        <div class="item-icon">${tipoEmoji[g.Tipo]||'📌'}</div>
        <div class="item-body">
          <div class="item-title">${g.Descripcion}</div>
          <div class="item-sub">${fmtDate(g.Fecha)}${g.Hora?' · '+g.Hora:''}</div>
          ${g.Notas?`<div style="font-size:12px;color:var(--text-muted)">${g.Notas}</div>`:''}
          <div style="margin-top:5px">
            ${g.Estado==='Hecha'?'<span class="hecha-badge">✅ Hecha</span>':vencido?`<span class="vencido-badge">🔴 Vencida hace ${diasV} día${diasV!==1?'s':''}</span>`:'<span class="pendiente-badge">⏳ Pendiente</span>'}
          </div>
        </div>
        <div class="item-actions" style="flex-direction:column;gap:6px">
          ${g.Estado!=='Hecha'?`<div class="icon-btn" onclick="marcarGestionHecha('${g.ID}')">✅</div>`:`<div class="icon-btn" onclick="revertirGestion('${g.ID}')" title="Reabrir">↩️</div>`}
          <div class="icon-btn" onclick="editGestion('${g.ID}')">✏️</div>
          <div class="icon-btn" onclick="deleteGestion('${g.ID}')">🗑️</div>
        </div>
      </div>`;
    }).join('');
  }
  el.innerHTML=html;
}
function filtroGest(f,btn){
  state.filtroGestiones=f;
  document.querySelectorAll('#mas-content .filtro-btn').forEach(b=>b.classList.remove('active'));
  if(btn)btn.classList.add('active');
  renderGestiones();
}
async function saveGestion(forzar=false){
  const id=document.getElementById('gestion-id').value;
  const desc=document.getElementById('gestion-desc').value.trim();
  if(!desc){showToast('⚠️ La descripción es obligatoria');return;}
  if(!forzar&&!id){
    const dup=checkDuplicate(state.data.gestiones.filter(g=>g.Estado!=='Hecha'),'Descripcion',desc);
    if(dup){confirmDuplicate(`Ya tienes una gestión similar: "${dup.Descripcion}"`,()=>saveGestion(true));return;}
  }
  const data={Descripcion:desc,Tipo:document.getElementById('gestion-tipo').value,
    Fecha:document.getElementById('gestion-fecha').value,Hora:document.getElementById('gestion-hora').value,
    Estado:'Pendiente',Notas:document.getElementById('gestion-notas').value.trim()};
  showSaving();
  const res=id?await apiPost({action:'update',sheet:'Gestiones',id,data}):await apiPost({action:'add',sheet:'Gestiones',data});
  hideSaving();
  if(res.error){showToast('❌ Error guardando');return;}
  showToast(id?'✅ Gestión actualizada':'✅ Gestión agregada');
  closeModal('modal-gestion');loadMas('gestiones');
}
async function marcarGestionHecha(id){
  showSaving('✅ Marcando...');
  await apiPost({action:'update',sheet:'Gestiones',id,data:{Estado:'Hecha'}});
  hideSaving();showToast('✅ ¡Gestión completada!');loadMas('gestiones');
}
async function revertirGestion(id){
  showSaving('↩️ Reabriendo...');
  await apiPost({action:'update',sheet:'Gestiones',id,data:{Estado:'Pendiente'}});
  hideSaving();showToast('↩️ Gestión reabierta');loadMas('gestiones');
}
function editGestion(id){
  const g=state.data.gestiones.find(x=>x.ID==id);if(!g)return;
  document.getElementById('gestion-id').value=g.ID;
  document.getElementById('gestion-desc').value=g.Descripcion;
  document.getElementById('gestion-tipo').value=g.Tipo;
  document.getElementById('gestion-fecha').value=g.Fecha;
  document.getElementById('gestion-hora').value=g.Hora||'';
  document.getElementById('gestion-notas').value=g.Notas||'';
  document.getElementById('gestion-modal-title').textContent='✏️ Editar Gestión';
  openModal('modal-gestion');
}
async function deleteGestion(id){
  const g=state.data.gestiones.find(x=>x.ID==id);
  showConfirm({icon:'🗑️',msg:`¿Eliminar "${g?.Descripcion}"?`,sub:'Esta acción no se puede deshacer.',okLabel:'Eliminar',okClass:'btn-danger',onOk:async()=>{
    showSaving('🗑️ Eliminando...');
    await apiPost({action:'delete',sheet:'Gestiones',id});
    hideSaving();showToast('🗑️ Eliminada');loadMas('gestiones');
  }});
}

// ── PRESTADOS ────────────────────────────────────
function renderPrestados(){
  const tipoEmoji={Objeto:'📦',Ropa:'👗',Dinero:'💵',Otro:'📌'};
  const el=document.getElementById('mas-content');
  const pendientes=state.data.prestados.filter(p=>p.Estado==='Pendiente');
  const devueltos=state.data.prestados.filter(p=>p.Estado==='Devuelto');
  let html=`
    <div style="display:flex;gap:8px;margin-bottom:16px">
      <button class="btn btn-outline" style="flex:1" onclick="openSpecificModal('prestado')">+ Nuevo Prestado</button>
    </div>
    <div class="filtros">
      <button class="filtro-btn ${state.filtroPrestados==='pendientes'?'active':''}" onclick="filtroPrest('pendientes',this)">⏳ Pendientes (${pendientes.length})</button>
      <button class="filtro-btn ${state.filtroPrestados==='historial'?'active':''}" onclick="filtroPrest('historial',this)">📋 Devueltos (${devueltos.length})</button>
    </div>`;
  const items=state.filtroPrestados==='historial'?devueltos:pendientes;
  if(!items.length){
    html+=`<div class="empty"><div class="empty-icon">📦</div><div class="empty-text">${state.filtroPrestados==='historial'?'Sin historial aún':'¡Nada prestado pendiente! 🎉'}</div></div>`;
  }else{
    html+=items.map(p=>`
      <div class="item">
        <div class="item-icon">${tipoEmoji[p.Tipo]||'📦'}</div>
        <div class="item-body">
          <div class="item-title">${p.Descripcion}</div>
          <div class="item-sub">👤 ${p.Persona} · ${fmtDate(p.Fecha_Prestamo)}</div>
          ${p.Fecha_Devolucion_Esperada?`<div style="font-size:12px;color:var(--yellow)">📅 Devolver el ${fmtDate(p.Fecha_Devolucion_Esperada)}</div>`:''}
          ${p.Notas?`<div style="font-size:12px;color:var(--text-muted)">${p.Notas}</div>`:''}
          ${p.Estado==='Devuelto'?'<span class="hecha-badge" style="margin-top:5px;display:inline-block">✅ Devuelto</span>':''}
        </div>
        <div class="item-actions" style="flex-direction:column;gap:6px">
          ${p.Estado==='Pendiente'?`<div class="icon-btn" onclick="marcarPrestadoDevuelto('${p.ID}')">✅</div>`:`<div class="icon-btn" onclick="revertirPrestado('${p.ID}')" title="Reabrir">↩️</div>`}
          <div class="icon-btn" onclick="editPrestado('${p.ID}')">✏️</div>
          <div class="icon-btn" onclick="deletePrestado('${p.ID}')">🗑️</div>
        </div>
      </div>`).join('');
  }
  el.innerHTML=html;
}
function filtroPrest(f,btn){
  state.filtroPrestados=f;
  document.querySelectorAll('#mas-content .filtro-btn').forEach(b=>b.classList.remove('active'));
  if(btn)btn.classList.add('active');
  renderPrestados();
}
async function savePrestado(forzar=false){
  const id=document.getElementById('prestado-id').value;
  const desc=document.getElementById('prestado-desc').value.trim();
  const persona=document.getElementById('prestado-persona').value.trim();
  if(!desc||!persona){showToast('⚠️ Descripción y persona son obligatorios');return;}
  if(!forzar&&!id){
    const dup=state.data.prestados.find(p=>p.Estado==='Pendiente'&&p.Persona.toLowerCase()===persona.toLowerCase()&&p.Descripcion.toLowerCase()===desc.toLowerCase());
    if(dup){confirmDuplicate(`Ya tienes registrado "${desc}" prestado a ${persona}`,()=>savePrestado(true));return;}
  }
  const data={Tipo:document.getElementById('prestado-tipo').value,Descripcion:desc,Persona:persona,
    Fecha_Prestamo:document.getElementById('prestado-fecha').value,
    Fecha_Devolucion_Esperada:document.getElementById('prestado-devolucion').value,
    Estado:'Pendiente',Notas:document.getElementById('prestado-notas').value.trim()};
  showSaving();
  const res=id?await apiPost({action:'update',sheet:'Prestados',id,data}):await apiPost({action:'add',sheet:'Prestados',data});
  hideSaving();
  if(res.error){showToast('❌ Error guardando');return;}
  showToast(id?'✅ Actualizado':'✅ Prestado registrado');
  closeModal('modal-prestado');loadMas('prestados');
}
async function marcarPrestadoDevuelto(id){
  showSaving('✅ Marcando...');
  await apiPost({action:'update',sheet:'Prestados',id,data:{Estado:'Devuelto'}});
  hideSaving();showToast('✅ Marcado como devuelto');loadMas('prestados');
}
async function revertirPrestado(id){
  showSaving('↩️ Reabriendo...');
  await apiPost({action:'update',sheet:'Prestados',id,data:{Estado:'Pendiente'}});
  hideSaving();showToast('↩️ Prestado reabierto');loadMas('prestados');
}
function editPrestado(id){
  const p=state.data.prestados.find(x=>x.ID==id);if(!p)return;
  document.getElementById('prestado-id').value=p.ID;
  document.getElementById('prestado-desc').value=p.Descripcion;
  document.getElementById('prestado-tipo').value=p.Tipo;
  document.getElementById('prestado-persona').value=p.Persona;
  document.getElementById('prestado-fecha').value=p.Fecha_Prestamo;
  document.getElementById('prestado-devolucion').value=p.Fecha_Devolucion_Esperada||'';
  document.getElementById('prestado-notas').value=p.Notas||'';
  document.getElementById('prestado-modal-title').textContent='✏️ Editar Prestado';
  openModal('modal-prestado');
}
async function deletePrestado(id){
  const p=state.data.prestados.find(x=>x.ID==id);
  showConfirm({icon:'🗑️',msg:`¿Eliminar "${p?.Descripcion}"?`,sub:'Esta acción no se puede deshacer.',okLabel:'Eliminar',okClass:'btn-danger',onOk:async()=>{
    showSaving('🗑️ Eliminando...');
    await apiPost({action:'delete',sheet:'Prestados',id});
    hideSaving();showToast('🗑️ Eliminado');loadMas('prestados');
  }});
}

// ── VISTA SEMANAL ────────────────────────────────
async function renderSemana(){
  const res=await api({action:'getDashboard'});
  const el=document.getElementById('mas-content');
  if(res.error||!res.data){el.innerHTML=`<div class="error-box"><div class="empty-icon">⚠️</div><div class="empty-text">Error de conexión</div><button class="btn btn-outline btn-sm" style="width:auto;margin:0 auto" onclick="renderSemana()">🔄 Reintentar</button></div>`;return;}
  const items=res.data.proximos_7_dias;
  if(!items.length){el.innerHTML='<div class="empty"><div class="empty-icon">🗓️</div><div class="empty-text">¡Semana libre! Nada próximo 🎉</div></div>';return;}
  const grupos={};
  items.forEach(item=>{if(!grupos[item.fecha])grupos[item.fecha]=[];grupos[item.fecha].push(item);});
  const dias=['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
  let html='';
  Object.keys(grupos).sort().forEach(fecha=>{
    const d=new Date(fecha+'T12:00:00');
    html+=`<div class="dia-grupo"><span class="dia-label">📅 ${dias[d.getDay()]} ${fmtDate(fecha)}</span>`;
    grupos[fecha].forEach(item=>{
      html+=`<div class="item"><div class="item-icon">${item.emoji}</div>
        <div class="item-body"><div class="item-title">${item.texto}</div>
        <div class="item-sub">${item.hora||''}${item.monto?' · '+fmt(item.monto):''}</div></div></div>`;
    });
    html+='</div>';
  });
  el.innerHTML=html;
}

  ['prestamo-fecha','pago-fecha','gestion-fecha','prestado-fecha'].forEach(id=>document.getElementById(id).value=tv);
  loadDashboard();
});
